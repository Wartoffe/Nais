
server.port=9060
spring.application.name=library-service

spring.data.cassandra.contact-points=localhost
spring.data.cassandra.keyspace-name=library
spring.data.cassandra.port=9042

spring.data.cassandra.schema-action=CREATE_IF_NOT_EXISTS

redis.host=localhost
redis.port=6379

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.service-url.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.client.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ── RabbitMQ ──────────────────────────────────────────────────────────────
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ── Choreography saga topology (book visibility) ────────────────────────────
# Shared topic exchange with the search (Elasticsearch) service.
saga.rabbitmq.exchange=library.saga.exchange
# Queue this service (the saga's "loan/return" initiator) consumes from.
saga.rabbitmq.queue.results=library.book.visibility.results
saga.rabbitmq.routing-key.hide-requested=book.hide.requested
saga.rabbitmq.routing-key.hide-completed=book.hide.completed
saga.rabbitmq.routing-key.hide-failed=book.hide.failed
saga.rabbitmq.routing-key.unhide-requested=book.unhide.requested
saga.rabbitmq.routing-key.unhide-completed=book.unhide.completed
saga.rabbitmq.routing-key.unhide-failed=book.unhide.failed
