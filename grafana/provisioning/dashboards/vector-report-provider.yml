apiVersion: 1

providers:
  - name: "Vector Reports"
    orgId: 1
    folder: "Vector Reports"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # Deliberately NOT /etc/grafana/dashboards - that path is already owned
      # by the "Library Dashboards" provider (Biblioteka folder, scanned
      # recursively), and NOT /etc/grafana/book-report-dashboards which
      # belongs to "Book Reports". Uses its own dedicated mount instead -
      # see the docker-compose.yml volume addition below.
      path: /etc/grafana/vector-report-dashboards